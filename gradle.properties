org.gradle.workers.max=2
org.gradle.caching=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=7325
APP_VERSION_NAME=13.2.2
APP_PACKAGE=com.meerogram.app
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
# R14.13c: 8g + parallel workers pushed the hosted runner into a host shutdown during R8
# (exit 143, 'runner has received a shutdown signal'). A tighter heap + fewer workers fits.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=768m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true

